services:
  5gc:
    container_name: open5gs_5gc_janus
    build:
      context: open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.0"
    env_file:
      - ${OPEN_5GS_ENV_FILE:-open5gs/open5gs.env}
    privileged: true
    volumes:
      - ./open5gs:/home/ogs-5gc:rw
    ports:
      - "9999:9999/tcp"
    # Uncomment port to use the 5gc from outside the docker network
    #  - "38412:38412/sctp"
    #  - "2152:2152/udp"
    command: 5gc -c open5gs-5gc.yml 
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      ran:
        #ipv4_address: ${OPEN5GS_IP:-10.45.0.1}
        ipv4_address: ${OPEN5GS_IP:-10.53.1.2}

  gnb:
    container_name: janus_srsran_gnb
    image: ghcr.io/microsoft/jrtc-apps/srs-jbpf-sdk #janus_srsran/gnb
    privileged: true
    user: "0:0"
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
      - SYS_ADMIN
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /dev/bus/usb/:/dev/bus/usb/
      - /tmp/jbpf:/tmp/jbpf:rw #### Ushasi - reverse proxy for jbpf
      - /usr/share/uhd/images:/usr/share/uhd/images
      - gnb-storage:/tmp
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - ./jrtc-apps/containers/Docker/srsRAN_Project:/src:rw
      - ./jrtc-apps/codelets:/out/codelets:rw
      - ./jrtc-apps/utils:/out/utils:rw
      - ./jrtc-apps/jrtc_apps:/out/jrtc_apps:rw
      - ./jrtc-apps/jbpf_protobuf:/out/jbpf_protobuf:rw
      - ./jrtc-apps/.env:/out/.env:rw
      - ./jrtc-apps/set_vars.sh:/out/set_vars.sh:rw
      - /dev/shm:/dev/shm:rw
      - /dev/hugepages:/dev/hugepages:rw
      - /sys/:/sys/:rw
      - /dev:/dev:rw
      - /jrtc-config:/jrtc-config:rw
      - /var/jbpf:/var/jbpf:rw
      # - /apps:/apps:rw
      # - .:/home/Janus-srs:rw
    environment:
      - SRSRAN_DIR=/src
      - USE_JRTC=1
      - SRSRANAPP_DIR=/out
      - JRTC_APPS=/out/jrtc_apps
    networks:
      ran:
        ipv4_address: ${GNB_IP:-10.53.1.3}
    depends_on:
      5gc:
        condition: service_healthy
    entrypoint: ["/bin/bash"]
    command: ["-c", "tail -f /dev/null"]

  jrtc:
    container_name: jrtc_controller
    pid: "container:janus_srsran_gnb" ##Ushasi - new
    build:
      context: ./jrt-controller
      dockerfile: ../jrt-controller/deploy/azurelinux.Dockerfile
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
      - SYS_ADMIN
      - IPC_LOCK
    volumes:
      - ./jrt-controller:/jrt-controller:rw
      - /tmp/jbpf:/tmp/jbpf:rw
      - ./jrtc-apps/codelets:/out/codelets:rw
      - ./jrtc-apps/utils:/out/utils:rw
      - ./jrtc-apps/.env:/out/.env:rw
      - ./jrtc-apps/set_vars.sh:/out/set_vars.sh:rw
      - ./jrtc-apps/jrtc_apps:/out/jrtc_apps:rw
      - /dev/shm:/dev/shm:rw ### Ushasi - new
      - /dev/hugepages:/dev/hugepages:rw
      - /sys/:/sys/:rw
      - /dev:/dev:rw
      - /jrtc-config:/jrtc-config:rw
      - /var/jbpf:/var/jbpf:rw ### Ushasi - new
      #- /apps:/apps:rw
    user: "0:0" ### Ushasi - new
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - JRTC_PATH=/jrtc
      - USE_JRTC=1
      - SRSRANAPP_DIR=/out
      - JRTC_APPS=/out/jrtc_apps
    networks:
      ran:
        ipv4_address: ${JRT_CONTROLLER_IP:-10.53.1.4}
    depends_on:
      gnb:
        condition: service_started
    entrypoint: ["/bin/bash"]
    command: ["-c", "tail -f /dev/null"]


