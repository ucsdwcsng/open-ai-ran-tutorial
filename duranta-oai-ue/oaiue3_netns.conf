# OAI nr-UE ZMQ config -> srsRAN gNB (n78 TDD 20MHz 30kHz), PLMN 99970.
# Subscriber 999700000000001 already exists in the Open5GS helm core (same key/opc
# as the srsUE configs). ZMQ ports cross the gNB's: gNB tx 4556 -> UE rx 4556 ;
# UE tx 4557 -> gNB rx 4557.

uicc0 = {
  imsi = "999700000000003";
  key = "00112233445566778899aabbccddeeff";
  opc = "63bfa50ee6523365ff14c1f45f88737d";
  dnn = "internet";
  nssai_sst = 1;
};

uecap_file = "/tmp/uecap_ports1.xml";

device = {
  name = "oai_zmqdevif";
};

zmq = (
  {
    tx_channels = ( "tcp://10.201.3.2:2021" );
    rx_channels = ( "tcp://10.201.3.1:2020" );
  }
);

log_config = {
  global_log_level = "info";
};
