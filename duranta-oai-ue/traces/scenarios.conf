# Trace recipes for gen_traces.py, one per line:  name  mode  key=value ...
# python3 gen_traces.py --all  writes lib/<name>.csv for every line. Generation is deterministic
# (fixed seeds), so a file can always be rebuilt from its line. To add a trace, add a line.
#
# Every recipe takes duration_s (default 300) and step_s (default 0.01, one row per 10 ms).
#
# walk   2D random walk around the gNB. Keys and defaults:
#          seed=1 speed_kmh=30 start_m=60 min_m=30 max_m=120 heading_sd_deg=30
#          ref_m=50 dl_snr_ref=25 ul_snr_ref=25 path_loss_exp=37.6
#          shadow_db=4 decorr_m=20 dl_snr_min=8 ul_snr_min=5
#        SNR = snr_ref at ref_m, minus path_loss_exp dB per decade of distance, plus shadowing
#        (shadow_db rms, decorrelating over decorr_m metres travelled). With min_m=30 and
#        max_m=120 the DL moves between ~33 and ~11 dB before shadowing (median ~16 dB).
#
# bounce The UE's built-in channel model (chan_sim.cpp), with the same keys as a --channel spec:
#          distance=100 speed=0 min_distance=0 max_distance=0 dl_snr_ref=25 ul_snr_ref=25
#          path_loss_exp=37.6 dl_snr_min=8 ul_snr_min=5 jitter_db=0 seed=0
#        A line here plays exactly what the same --channel spec plays, from the trace's start.
#        Its jitter_db is a new independent value every 10 ms (interpolated): fast variation that
#        link adaptation cannot follow, unlike the slow shadowing of a walk.
#
# Measured on this cell (zmq-channel.md): CQI 15 above ~22 dB DL SNR, 13 at 16 dB, 9 at 8 dB.

# Random walks: speeds from walking to motorway, each from its own start point and seed
trace_1      walk    seed=1  speed_kmh=3    start_m=50   min_m=30  max_m=120
trace_2      walk    seed=2  speed_kmh=10   start_m=80   min_m=30  max_m=120
trace_3      walk    seed=3  speed_kmh=20   start_m=40   min_m=30  max_m=120
trace_4      walk    seed=4  speed_kmh=30   start_m=100  min_m=30  max_m=120
trace_5      walk    seed=5  speed_kmh=50   start_m=60   min_m=30  max_m=120
trace_6      walk    seed=6  speed_kmh=60   start_m=120  min_m=30  max_m=120
trace_7      walk    seed=7  speed_kmh=80   start_m=70   min_m=30  max_m=120
trace_8      walk    seed=8  speed_kmh=100  start_m=90   min_m=30  max_m=120

# Constant channels, one row each (a one-row trace holds its value)
static_30db  bounce  dl_snr_ref=30 ul_snr_ref=30 duration_s=0.01
static_16db  bounce  dl_snr_ref=16 ul_snr_ref=16 duration_s=0.01
static_12db  bounce  dl_snr_ref=12 ul_snr_ref=12 duration_s=0.01

# The built-in mobility scenarios as traces (ue_channel_mobility.conf ue2 and ue1, ue_channel_4ue.conf ue4)
ped_3kmh     bounce  distance=80 speed=3   min_distance=30 max_distance=60  dl_snr_ref=22 ul_snr_ref=22 jitter_db=5 seed=2
veh_30kmh    bounce  distance=50 speed=30  min_distance=40 max_distance=140 dl_snr_ref=25 ul_snr_ref=25 jitter_db=4 seed=4
veh_104kmh   bounce  distance=50 speed=104 min_distance=40 max_distance=250 dl_snr_ref=25 ul_snr_ref=25 jitter_db=5 seed=1

# ---- CQI-targeted traces (mode cqi): a CQI process in [lo, hi] = [4, 15], mapped to DL SNR through cqi_calib.csv,
# UL held at 20 dB. dwell_s is how long each CQI value holds (the gNB sees CQI every 10-20 ms CSI period).
# EdgeRIC-RT 4-UE scenario: four independent walks, so the best UE keeps changing.
cqi_walk_1    cqi  process=walk seed=11
cqi_walk_2    cqi  process=walk seed=12
cqi_walk_3    cqi  process=walk seed=13
cqi_walk_4    cqi  process=walk seed=14
# Good vs bad channel (EdgeRIC synthetic scenario 2, with the bad band at 4..7 instead of 1..7)
cqi_good      cqi  process=band lo=8 hi=15 seed=21
cqi_bad       cqi  process=band lo=4 hi=7 seed=22
# CQI drawn afresh every dwell (scenario 3)
cqi_iid_1     cqi  process=iid seed=31
cqi_iid_2     cqi  process=iid seed=32
cqi_tri       cqi  process=triangle period_s=20 dwell_s=0.2
# The EdgeRIC NSDI'24 mobility traces (src_cqi/, 10 ms per row), rescaled from CQI 0/1..15 to 4..15
cqi_car_10mph cqi  process=replay src=src_cqi/car_10mph.txt src_dt_ms=10 dwell_s=0.02
cqi_car_20mph cqi  process=replay src=src_cqi/car_20mph.txt src_dt_ms=10 dwell_s=0.02
cqi_drone     cqi  process=replay src=src_cqi/drone.txt src_dt_ms=10 dwell_s=0.02
cqi_drone_b   cqi  process=replay src=src_cqi/drone_b.txt src_dt_ms=10 dwell_s=0.02
cqi_robot     cqi  process=replay src=src_cqi/robot.txt src_dt_ms=10 dwell_s=0.02
cqi_turntable cqi  process=replay src=src_cqi/turntable.txt src_dt_ms=10 dwell_s=0.02
# Calibration sweep for cqi_calib.csv: DL 0 -> 24 dB in 1 dB steps of 2 s (replay on one full-buffer UE)
cal_staircase staircase snr_lo=0 snr_hi=24 snr_step=1 dwell_s=2
