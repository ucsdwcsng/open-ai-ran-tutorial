# Per-UE channel, one line per UE.  Used by:  bash scripts/setup_zmq_chan_demo.sh <N> --channel <this file>
# Same format as ocudu-edgeric configs/ue_mobility.conf; the model is duranta-ue radio/zmq/chan_sim.cpp
# (docs/zmq-channel.md there).
#
# Distance drives everything:  SNR(t) = dl_snr_ref - 37.6 * log10( d(t) / dist )
# The UE starts at `dist`, moves at `speed`, and bounces between `min` and `max`.
# The UL is attenuated by the same path loss against the gNB noise floor (ul_noise_dbfs below).
# jitter_db is a slow random SNR offset (shadowing, rms dB); it is what produces block errors.
# UEs with no line get a clean channel (no added noise at all).
#
# Measured on this cell: CQI 15 above ~22 dB DL SNR (65.7 Mbps at 30 dB), 13 at 16 dB, 9 at 8 dB.
#
# This default is the "very good channel" case: static, 30 dB, no shadowing -> CQI 15 on every UE.
# For mobility see ue_channel_mobility.conf.
#
# ue   dist_m   speed_kmh   min_m   max_m   dl_snr_ref   ul_snr_ref   jitter_db   [dl_min   ul_min]
  1    50       0           40      60      30           30           0
  2    50       0           40      60      30           30           0
  3    50       0           40      60      30           30           0
  4    50       0           40      60      30           30           0
  5    50       0           40      60      30           30           0
  6    50       0           40      60      30           30           0
  7    50       0           40      60      30           30           0
  8    50       0           40      60      30           30           0

# gNB receiver noise floor in dBFS (one value for the cell, added by the broker after the UL sum).
# Comment it out to leave the UL untouched and vary only the DL.
ul_noise_dbfs -65
