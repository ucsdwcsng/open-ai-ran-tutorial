# Which channel trace each UE replays. Used by:
#   bash scripts/setup_zmq_chan_demo.sh 4 --traces duranta-oai-ue/ue_traces_4ue.conf
# and at run time by:  bash scripts/trace_ctl.sh apply <this file>
#
# One line per UE: ue, then a trace from duranta-oai-ue/traces/lib (trace_ctl.sh list) or the path
# of a CSV file, then optionally "once" to hold the last row instead of looping. Several UEs can
# share a trace; they then see the same SNRs at the same instants. A UE without a line keeps its
# base channel (its --channel line, else static 30 dB) until trace_ctl.sh set switches it.
# Comments on their own lines only.
#
# ue   trace
  1    trace_1
  2    trace_1
  3    trace_5
  4    trace_6

# gNB receiver noise floor in dBFS, for the broker and every UE (default -65)
ul_noise_dbfs -65
