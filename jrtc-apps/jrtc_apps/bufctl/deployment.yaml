# yaml-language-server: $schema=../../tools/schemas/jrtc-ctl..schema.json
#
# bufctl -- manual RLC DL buffer-size control.
# Loads the bufctl codeletset (rlc_ctrl on rlc_dl_ctrl) and the bufctl_app xApp,
# which relays commands from bufctl_cli.py and records the codelet's reports.
#
# Load and unload it around a session:
#   jrtc-ctl load   -c /apps/bufctl/deployment.yaml
#   jrtc-ctl unload -c /apps/bufctl/deployment.yaml
# bufctl_cli.py does this for you.

name: bufctl

decoder:
  - type: decodergrpc
    host: jrtc-decoder.ran.svc.cluster.local
    port: 20789

app:
  - name: bufctl_app
    path: ${JRTC_APPS}/bufctl/bufctl_app.py
    type: python
    host: jrtc-service.ran.svc.cluster.local
    port: 3001
    modules:
      - ${JBPF_CODELETS}/bufctl/rlc_ctrl_report.py

jbpf:
  device:
    - id: 1
      host: srs-gnb-du1-proxy.ran.svc.cluster.local
      port: 30450

  codelet_set:
    - device: 1
      config: ${JBPF_CODELETS}/bufctl/bufctl.yaml
