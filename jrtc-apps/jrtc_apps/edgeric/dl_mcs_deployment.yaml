# yaml-language-server: $schema=../../tools/schemas/jrtc-ctl..schema.json
#
# EdgeRIC-on-Janus DL MCS: loads the edgeric_mcs codeletset (dl_mcs on the
# mac_sched_dl_mcs_ctrl hook) and the dl_mcs_app muApp (per-UE MCS policy pushed
# back into the codelet).

name: edgeric_mcs

decoder:
  - type: decodergrpc
    host: jrtc-decoder.ran.svc.cluster.local
    port: 20789

app:
  - name: dl_mcs_app
    path: ${JRTC_APPS}/edgeric/dl_mcs_app.py
    type: python
    host: jrtc-service.ran.svc.cluster.local
    port: 3001
    modules:
      - ${JBPF_CODELETS}/edgeric/dl_mcs_report.py

jbpf:
  device:
    - id: 1
      host: srs-gnb-du1-proxy.ran.svc.cluster.local
      port: 30450

  codelet_set:
    - device: 1
      config: ${JBPF_CODELETS}/edgeric/edgeric_mcs.yaml
