# COTS UE SIMs for:  bash scripts/setup_ota.sh --sims ota/sims.conf
# One line per SIM: IMSI, Ki, OPc (hex). The setup adds each SIM to Open5GS, or updates its Ki/OPc if the
# IMSI is already there. Slice, DNN (internet, IPv4v6) and AMBR are copied from subscriber 999700000000001.
#
# The IMSI must start with the testbed PLMN 99970, and its last 9 digits are the UE number on the
# Grafana dashboard (999700000000011 -> UE 11).
#
# A SIM programmed as 99970000000000N (N = 1..8) with the testbed's Ki/OPc needs no line here: the setup
# always provisions 999700000000001..008 with
#   Ki  00112233445566778899aabbccddeeff
#   OPc 63bfa50ee6523365ff14c1f45f88737d
#
# imsi              ki                                 opc
# 999700000000011   0123456789abcdef0123456789abcdef   0123456789abcdef0123456789abcdef
