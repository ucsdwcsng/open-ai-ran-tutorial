#
# Telemetry backend for the user-plane telemetry (upt) dashboard.
#
#   upt_app (jrtc)  --InfluxDB line protocol-->  VictoriaMetrics  <--PromQL--  Grafana
#
# Both are exposed on NodePorts inside the 30400-30500 range, which the k3d
# cluster already publishes to the host (see README step 2), so no extra
# port-mapping is needed:
#
#   Grafana          http://<host>:30490   (admin / admin)
#   VictoriaMetrics  http://<host>:30491
---
apiVersion: v1
kind: Namespace
metadata:
  name: ran
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: ran
spec:
  replicas: 1
  selector:
    matchLabels: { app: victoria-metrics }
  template:
    metadata:
      labels: { app: victoria-metrics }
    spec:
      containers:
        - name: vm
          image: victoriametrics/victoria-metrics:v1.102.1
          args:
            - "-storageDataPath=/vmdata"
            - "-retentionPeriod=7d"
            # keep the fine-grained buckets: the codelets emit every ~134 ms
            - "-dedup.minScrapeInterval=0s"
            - "-search.latencyOffset=1s"
            - "-httpListenAddr=:8428"
          ports:
            - containerPort: 8428
          volumeMounts:
            - name: data
              mountPath: /vmdata
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: ran
spec:
  type: NodePort
  selector: { app: victoria-metrics }
  ports:
    - port: 8428
      targetPort: 8428
      nodePort: 30491
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: ran
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        # uid MUST be pinned: the dashboard panels reference it explicitly.
        # Without it Grafana generates a random uid and every panel shows "No data".
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics.ran.svc.cluster.local:8428
        isDefault: true
        jsonData:
          timeInterval: "100ms"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: ran
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: upt
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ran
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            # Grafana refuses any dashboard refresh faster than this (default 5s)
            # and silently falls back, so it must be lowered for the 500ms refresh
            # on the user-plane dashboard to take effect.
            - name: GF_DASHBOARDS_MIN_REFRESH_INTERVAL
              value: "500ms"
            # allow embedding / simplifies access over an SSH tunnel
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s:%(http_port)s/"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource
          configMap: { name: grafana-datasource }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap:
            name: grafana-upt-dashboard
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ran
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30490
